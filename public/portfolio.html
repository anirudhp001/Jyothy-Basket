<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Jyothy Basket</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
    <style>
        .portfolio-wrap { max-width: 760px; margin: 3rem auto; padding: 0 2rem; }
        .profile-header { text-align: center; margin-bottom: 3rem; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem; font-weight: 700; color: #000; font-family: var(--font-heading); }
        .profile-header h2 { margin: 0.25rem 0; font-size: 1.5rem; }
        .profile-header p { color: var(--text-secondary); margin: 0; font-size: 0.9rem; }

        .order-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 1.5rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .order-id { font-family: monospace; font-size: 1rem; font-weight: 700; color: var(--accent); }
        .order-meta { display: flex; flex-direction: column; gap: 0.25rem; }
        .order-meta p { margin: 0; font-size: 0.85rem; color: var(--text-secondary); }
        .order-meta .total { font-weight: 700; color: var(--text-primary); font-size: 1rem; }

        .status-pill { display: inline-flex; align-items: center; padding: 0.3rem 0.9rem; border-radius: 999px;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .s-placed { background: rgba(229,255,0,0.1); color: var(--accent); }
        .s-processing { background: rgba(59,130,246,0.1); color: #60a5fa; }
        .s-outfordelivery { background: rgba(251,146,60,0.1); color: #fb923c; }
        .s-delivered { background: rgba(34,197,94,0.1); color: #4ade80; }
        .s-cancelled { background: rgba(239,68,68,0.1); color: #f87171; }

        .track-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 0.5rem 1.25rem; border-radius: var(--radius-sm); font-size: 0.8rem; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.4rem; }
        .track-btn:hover { border-color: var(--accent); color: var(--accent); }

        .empty-state { text-align: center; padding: 4rem 2rem; }
        .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body>
    <header>
        <h1>Jyothy Basket</h1>
        <nav id="nav-links" aria-label="Main navigation"></nav>
    </header>
    <main>
        <div class="portfolio-wrap" id="portfolio-content">
            <div class="empty-state"><div class="icon">⏳</div><p style="color:var(--text-secondary);">Loading your profile...</p></div>
        </div>
    </main>
    <script>
        function statusClass(s) {
            const m = {'Order Placed':'placed','Processing':'processing','Out for Delivery':'outfordelivery','Delivered':'delivered','Cancelled':'cancelled'};
            return 's-' + (m[s] || 'placed');
        }

        function renderPortfolio(session, orders) {
            const c = document.getElementById('portfolio-content');
            if (!session.loggedIn) {
                c.innerHTML = `<div class="empty-state">
                    <div class="icon">🔒</div>
                    <h2 style="color:var(--text-primary);">Sign In Required</h2>
                    <p style="color:var(--text-secondary);margin-bottom:1.5rem;">Please log in to view your orders and profile.</p>
                    <a href="login.html" class="btn"><span>Sign In</span></a>
                </div>`;
                return;
            }

            let ordersHtml = '';
            if (!orders || !orders.length) {
                ordersHtml = `<div class="empty-state">
                    <div class="icon">🛒</div>
                    <p style="color:var(--text-secondary);">No orders placed yet.</p>
                    <a href="index.html" class="btn" style="margin-top:1rem;"><span>Start Shopping</span></a>
                </div>`;
            } else {
                orders.forEach(o => {
                    ordersHtml += `<div class="order-card">
                        <div class="order-meta">
                            <span class="order-id">${o.orderId}</span>
                            <p>${o.orderDate} · ${o.items.length} item(s)</p>
                            <p class="total">₹${o.totalAmount.toFixed(2)}</p>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.75rem;">
                            <span class="status-pill ${statusClass(o.status)}">${o.status}</span>
                            <a class="track-btn" href="track-order.html?orderId=${o.orderId}">🔍 Track Order</a>
                        </div>
                    </div>`;
                });
            }

            c.innerHTML = `
                <div class="profile-header">
                    <div class="avatar">${session.username.charAt(0).toUpperCase()}</div>
                    <h2>${session.username}'s Profile</h2>
                    <p>${session.email}</p>
                </div>
                <h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:1.5rem;">
                    Order History <span style="background:var(--bg-elevated);padding:0.2rem 0.6rem;border-radius:999px;font-size:0.75rem;margin-left:0.5rem;">${orders ? orders.length : 0}</span>
                </h3>
                ${ordersHtml}
            `;
        }

        // Load session, then orders
        fetch('SessionServlet')
            .then(r => r.json())
            .then(session => {
                if (!session.loggedIn) {
                    renderPortfolio(session, []);
                    return;
                }
                fetch('OrderServlet?action=myOrders')
                    .then(r => r.json())
                    .then(orders => renderPortfolio(session, orders))
                    .catch(() => renderPortfolio(session, []));
            })
            .catch(err => console.error("Portfolio error:", err));
    </script>
</body>
</html>
