<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Jyothy Basket shopping cart. Review items and proceed to checkout.">
    <title>Cart | Jyothy Basket</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Jyothy Basket</h1>
        <nav id="nav-links" aria-label="Main navigation"></nav>
    </header>
    <main>
        <h2>Your Shopping Cart</h2>
        <div class="cart-table-wrapper">
            <table class="cart-table" id="cart-table-content">
                <thead>
                    <tr>
                        <th scope="col">Product</th>
                        <th scope="col">Unit</th>
                        <th scope="col">Qty</th>
                        <th scope="col">Price</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="cart-summary" id="cart-summary"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('CartServlet')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector('#cart-table-content tbody');
                    const summary = document.getElementById('cart-summary');

                    if (!data.items || data.items.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-secondary);">
                            <div style="font-size:2.5rem;margin-bottom:1rem;">🛒</div>
                            <p style="font-size:1.1rem;margin-bottom:0.5rem;">Your cart is empty</p>
                            <p style="font-size:0.85rem;color:var(--text-muted);">Add grocery items from the store.</p>
                        </td></tr>`;
                        summary.innerHTML = '<a href="index.html" class="btn" style="width:100%;text-align:center;"><span>Browse Groceries</span></a>';
                        return;
                    }

                    let rows = '';
                    data.items.forEach(item => {
                        rows += `<tr>
                            <td style="font-weight:600;">${item.name}</td>
                            <td style="color:var(--text-secondary);font-size:0.85rem;">${item.unit}</td>
                            <td>
                                <form action="CartServlet" method="POST" style="margin:0;display:inline-flex;align-items:center;gap:0.4rem;">
                                    <input type="hidden" name="action" value="update">
                                    <input type="hidden" name="productId" value="${item.id}">
                                    <input type="hidden" name="returnUrl" value="cart.html">
                                    <input type="number" name="quantity" value="${item.quantity}" min="1" max="${item.stock}"
                                        style="width:55px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-primary);padding:0.3rem;border-radius:4px;text-align:center;"
                                        onchange="this.form.submit()">
                                </form>
                            </td>
                            <td>₹${item.price.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
                            <td style="font-weight:600;">₹${item.subtotal.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
                            <td>
                                <form action="CartServlet" method="POST" style="margin:0;">
                                    <input type="hidden" name="action" value="remove">
                                    <input type="hidden" name="productId" value="${item.id}">
                                    <input type="hidden" name="returnUrl" value="cart.html">
                                    <button type="submit" class="btn-remove" aria-label="Remove ${item.name}">Remove</button>
                                </form>
                            </td>
                        </tr>`;
                    });
                    tbody.innerHTML = rows;

                    summary.innerHTML = `
                        <h3>Total (${data.itemCount} item${data.itemCount !== 1 ? 's' : ''}): 
                            <span style="color:var(--accent);font-variant-numeric:tabular-nums;">
                                ₹${data.total.toLocaleString('en-IN', {minimumFractionDigits:2})}
                            </span>
                        </h3>
                        <a href="checkout.html" class="btn btn-cta"><span>Proceed to Checkout →</span></a>
                    `;
                })
                .catch(err => console.error('Cart error:', err));
        });
    </script>
</body>
</html>
