<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Securely complete your Jyothy Basket order with shipping details.">
    <title>Checkout | Jyothy Basket</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Jyothy Basket</h1>
        <nav id="nav-links" aria-label="Main navigation">
            <!-- Injected by main.js -->
        </nav>
    </header>
    <main>
        <div class="checkout-form">
            <h2 style="margin-top: 0; font-size: 1.75rem;">Checkout</h2>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: var(--space-lg); font-size: 0.9rem;">Complete your order securely</p>
            <form action="CheckoutServlet" method="POST">
                <label for="checkout-name">Full Name <span style="color: var(--color-danger);">*</span></label>
                <input type="text" id="checkout-name" name="name" placeholder="Enter your full name" required autocomplete="name">
                
                <label for="checkout-address">Shipping Address <span style="color: var(--color-danger);">*</span></label>
                <textarea id="checkout-address" name="address" rows="3" placeholder="Door No, Street, City, State - PIN" required autocomplete="street-address"></textarea>

                <label for="checkout-phone">Phone Number <span style="color: var(--color-danger);">*</span></label>
                <input type="tel" id="checkout-phone" name="phone" placeholder="+91 98765 43210" required autocomplete="tel">

                <button type="submit" class="btn btn-cta" style="width: 100%;">🛒 Place Order</button>
            </form>
        </div>
    </main>
</body>
</html>
