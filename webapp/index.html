<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jyothy Basket — StringTune Design Edition">
    <title>Jyothy Basket | Explore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Jyothy Basket</h1>
        
        <nav id="nav-links" aria-label="Main navigation">
            <!-- Injected by main.js -->
        </nav>
    </header>
    
    <main>
        <!-- The header gets the split-character animation just like StringTune -->
        <h2 id="collection-title" class="split-text">Crafted Selections. Minimal Distractions.</h2>
        
        <div style="margin-bottom: 3rem;">
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <label for="search-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Search</label>
                <input type="text" id="search-input" class="search-input-tech" placeholder="Search products...">
            </div>
        </div>
        
        <div id="product-container" class="grid-container">
            <!-- Items injected by fetch locally -->
        </div>
    </main>

    <footer>
        <p>Built with minimal aesthetics. Jyothy Basket &copy; 2026.</p>
    </footer>

    <script>
        let allProducts = [];

        function renderProducts(products) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            products.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'product-card';
                // Remove inline animation, our intersection observer handles it
                div.innerHTML = `
                    <div class="product-card-img-wrapper">
                        <img src="${p.imageUrl}" alt="${p.name}" loading="${i < 6 ? 'eager' : 'lazy'}" width="280" height="200">
                    </div>
                    <div style="display:flex; flex-direction:column; flex-grow:1;">
                        <span class="product-card-category">${p.category}</span>
                        <h3>${p.name}</h3>
                        <p class="desc">${p.description}</p>
                        <p class="price">₹${p.price.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                    </div>
                    <form action="CartServlet" method="POST" style="margin-top:auto;">
                        <input type="hidden" name="action" value="add">
                        <input type="hidden" name="productId" value="${p.id}">
                        <input type="hidden" name="returnUrl" value="index.html">
                        <!-- New stringtune styled button -->
                        <button type="submit" class="btn" style="width: 100%;"><span>Add to Cart</span></button>
                    </form>
                `;
                container.appendChild(div);
            });
        }

        fetch('ProductServlet')
            .then(response => response.json())
            .then(products => {
                allProducts = products;
                renderProducts(products);
            })
            .catch(err => console.error("Error fetching products: ", err));

        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(searchTerm) || p.category.toLowerCase().includes(searchTerm));
            
            // Because split-text removes raw text, we replace only if needed
            const collectionTitle = document.getElementById('collection-title');
            if (searchTerm) {
                collectionTitle.innerText = `Search Results (${filtered.length})`;
                collectionTitle.classList.remove('split-text');
            } else {
                collectionTitle.innerText = 'Crafted Selections. Minimal Distractions.';
                // We'd reinstall split-text animation logic here, but for simplicity we keep it static after search
            }
            
            renderProducts(filtered);
        });
    </script>
</body>
</html>
