<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Jyothy Basket portfolio — view account details and order history.">
    <title>My Portfolio | Jyothy Basket</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Jyothy Basket</h1>
        <nav id="nav-links" aria-label="Main navigation">
            <!-- Injected by main.js -->
        </nav>
    </header>
    <main>
        <div class="portfolio-card" id="portfolio-content">
            <h2 style="margin-top:0; font-size: 1.75rem;">Loading Portfolio...</h2>
            <p style="color: var(--text-secondary);">Fetching your account data...</p>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('SessionServlet')
                .then(res => res.json())
                .then(data => {
                    const content = document.getElementById('portfolio-content');
                    if (!data.loggedIn) {
                        content.innerHTML = `
                            <div style="text-align: center;">
                                <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.5;">🔒</div>
                                <h2 style="margin-top:0; color: var(--color-danger); font-size: 1.5rem;">Access Denied</h2>
                                <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">You must be logged in to view your portfolio.</p>
                                <a href="login.html" class="btn">Sign In</a>
                            </div>
                        `;
                    } else {
                        let html = `
                            <div style="text-align: center; margin-bottom: var(--space-xl);">
                                <div style="width: 64px; height: 64px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-md); font-size: 1.5rem; font-weight: 700; color: #fff; font-family: var(--font-heading);">
                                    ${data.username.charAt(0).toUpperCase()}
                                </div>
                                <h2 style="margin: 0 0 var(--space-sm) 0; color: var(--text-primary); font-size: 1.5rem;">${data.username}'s Portfolio</h2>
                                <p style="color: var(--text-secondary); font-size: 0.9rem;">Welcome to your personalized dashboard.</p>
                            </div>
                            
                            <div class="order-history">
                                <h3 style="margin-bottom: var(--space-md); font-size: 1.1rem;">
                                    Order History 
                                    <span style="background: var(--color-primary-light); color: var(--color-secondary); padding: 2px 10px; border-radius: var(--radius-full); font-size: 0.8rem; margin-left: var(--space-sm);">${data.orders.length}</span>
                                </h3>
                        `;
                        
                        if (data.orders.length === 0) {
                            html += `
                                <div style="text-align: center; padding: var(--space-xl); color: var(--text-secondary);">
                                    <p style="font-size: 1rem; margin-bottom: var(--space-sm);">No orders yet</p>
                                    <p style="font-size: 0.85rem; color: var(--text-muted);">Your completed orders will appear here.</p>
                                    <a href="index.html" class="btn" style="margin-top: var(--space-md);">Start Shopping</a>
                                </div>
                            `;
                        } else {
                            data.orders.reverse().forEach(o => {
                                html += `<div class="order-item"><p style="margin:0; font-size: 0.95rem;">${o}</p></div>`;
                            });
                        }
                        
                        html += `</div>`;
                        content.innerHTML = html;
                    }
                })
                .catch(err => console.error("Portfolio error:", err));
        });
    </script>
</body>
</html>
